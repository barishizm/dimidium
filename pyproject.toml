[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimidium"
version = "0.1.0"
description = "AI phone receptionist that answers calls in Lithuanian and asks the owner via Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "anthropic>=2.1",
    # GPT-Live sessions, SIP call control and sideband (openai.resources.live).
    "openai[realtime]>=3.36,<4",
    "pyyaml>=6",
    "aiogram>=3.31,<4",
    "httpx>=0.27",
    "numpy>=2",
    "websockets>=15",
    # Twilio webhooks post form data.
    "python-multipart>=0.0.20",
    # Telephony pipeline: FastAPI websocket transport, Twilio serializer, Silero VAD.
    "pipecat-ai[silero,websocket]>=1.12,<1.13",
]

[project.optional-dependencies]
google = [
    "google-cloud-speech>=2.33",
    "google-cloud-texttospeech>=2.31",
]
azure = [
    "azure-cognitiveservices-speech>=1.45",
]
# Speech benchmark: audio decoding/resampling and WER.
bench = [
    "soundfile>=0.13",
    "soxr>=0.5",
    "jiwer>=4",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "black>=24",
]

[tool.setuptools]
packages = ["app", "app.agent", "app.live", "app.speech", "app.telephony"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: calls real external APIs (skipped without credentials)",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
