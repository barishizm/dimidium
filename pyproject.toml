[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimidium"
version = "0.1.0"
description = "AI phone receptionist that answers calls in Lithuanian and asks the owner via Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    # Post-call summary (moves to the Responses API in a later commit).
    "anthropic>=2.1",
    # GPT-Live sessions, SIP call control and sideband (openai.resources.live).
    "openai[realtime]>=3.36,<4",
    "pyyaml>=6",
    "aiogram>=3.31,<4",
    "httpx>=0.27",
    "websockets>=15",
]

[project.optional-dependencies]
# scripts/live_smoke.py: decode and resample any caller recording.
audio = [
    "numpy>=2",
    "soundfile>=0.13",
    "soxr>=0.5",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "black>=24",
]

[tool.setuptools]
packages = ["app", "app.live"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: calls real external APIs (skipped without credentials)",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
